name: Build
run-name: ${{ github.actor }} is building app

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Vite 8/Rolldown supports Node ^20.19.0 or >=22.12.0.
          # Node 21 is unsupported and has no compatible native binding.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-build
          path: dist/
